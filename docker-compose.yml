version: '3.8'

services:
  # Laravel Application (PHP 8.4 + Octane)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travel-booking-app
    restart: unless-stopped
    expose:
      - "9000"
    ports:
      - "8080:80"
    command: >
      sh -c "
        /usr/sbin/php-fpm8.4 &
        /usr/sbin/nginx &
        php /var/www/html/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 &
        wait
      "
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=https://travel.denisugiarto.my.id
      - TRUSTED_PROXIES=*
      - TRUSTED_CLOUDFLARE=1
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=travel_booking
      - DB_USERNAME=travel_user
      - DB_PASSWORD=travel_password
      - REDIS_HOST=redis
      - REDIS_PASSWORD=null
      - REDIS_PORT=6379
      - CACHE_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
      - MAIL_MAILER=smtp
      - MAIL_HOST=mailpit
      - MAIL_PORT=1025
      - BROADCAST_CONNECTION=redis
    volumes:
      - ./:/var/www/html
      - app_storage:/var/www/html/storage
      - ./docker/nginx/default.conf:/etc/nginx/sites-available/default
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mailpit:
        condition: service_started
    networks:
      - travel-network
    healthcheck:
      disable: true

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: travel-booking-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - app_storage:/var/www/html/storage
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - travel-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: travel-booking-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=travel_booking
      - POSTGRES_USER=travel_user
      - POSTGRES_PASSWORD=travel_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - travel-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel_user -d travel_booking"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (Cache + Queue)
  redis:
    image: redis:7-alpine
    container_name: travel-booking-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - travel-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Laravel Horizon (Queue Worker Dashboard)
  horizon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travel-booking-horizon
    restart: unless-stopped
    command: php artisan horizon
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=travel_booking
      - DB_USERNAME=travel_user
      - DB_PASSWORD=travel_password
      - REDIS_HOST=redis
      - REDIS_PASSWORD=null
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
    volumes:
      - ./:/var/www/html
      - app_storage:/var/www/html/storage
    depends_on:
      - postgres
      - redis
    networks:
      - travel-network
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'horizon' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Mailpit (Local SMTP for development)
  mailpit:
    image: axllent/mailpit:latest
    container_name: travel-booking-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP server
      - "8025:8025"  # Web UI
    networks:
      - travel-network

  # Cloudflare Tunnel (accesses nginx from outside)
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: travel-booking-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN} --url http://app:80
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app
    networks:
      - travel-network

networks:
  travel-network:
    name: travel-booking_travel-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  app_storage:
    driver: local
